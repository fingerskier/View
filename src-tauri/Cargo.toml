[package]
name = "view"
version = "0.1.0"
description = "Omarchy file viewer: file tree + live-reloading renderers"
authors = ["fingerskier"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "view_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
notify = "8.2"
notify-debouncer-full = "0.7"
toml = "1"
dirs = "7"
libc = "0.2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
